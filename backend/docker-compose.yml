services:
  codemaster-ai:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./database:/app/database
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - PROJECT_ROOT=/app
      - API_KEY=${API_KEY:-}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_ENABLED=true
      - OLLAMA_DEFAULT_MODEL=qwen2.5-coder:1.5b
      - LLM_PROVIDER=ollama
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ../data/ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
