name: Python package

on:
  push:
    branches: [ "main", "Sam" ]
  pull_request:
    branches: [ "main", "Sam" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        
        dep_found=false
        
        if [ -f requirements.txt ]; then
            echo "Installing root requirements.txt..."
            python -m pip install -r requirements.txt
            dep_found=true
        fi
        
        if [ -f backend/requirements.txt ]; then
            echo "Installing backend/requirements.txt..."
            python -m pip install -r backend/requirements.txt
            dep_found=true
        fi
        
        if [ "$dep_found" = false ]; then
            echo "No dependency file found" >&2
            exit 1
        fi

        # Explicitly verify the packages used by the application configuration.
        python -m pip install "pydantic-settings>=2.0.0"
        python -m pip check
        python -c "import requests, pydantic_settings; print('CI dependency preflight: OK')"

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      run: |
        pytest --import-mode=importlib backend/
